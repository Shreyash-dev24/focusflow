
apiVersion: apps/v1
kind: Deployment
metadata:
  name: focusflow
  labels:
    app: focusflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: focusflow
  template:
    metadata:
      labels:
        app: focusflow
    spec:
      containers:
        - name: focusflow
          image: shreyash240811/focusflow:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
